# rpinode network settings (copie de rpi01)
# Routage IP : indispensable aux raccourcis du chantier (routes /32 Tailscale
# vers les équipements du LAN, voir services/shortcuts.py).
# Ignore routes on interfaces with link down (e.g. eth0 unplugged while wlan0 is active on same subnet)
net.ipv4.conf.all.ignore_routes_with_linkdown = 1
net.ipv4.conf.default.ignore_routes_with_linkdown = 1
net.ipv4.ip_forward = 1
