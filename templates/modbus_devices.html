<section class="modbus-devices-mgr">
    <div class="header-with-actions" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2>Appareils Modbus - Chantier: ${site_name}</h2>
        <button class="btn-primary" onclick="showAddDeviceModal()">➕ Ajouter un appareil</button>
    </div>

    <div class="site-devices">
        <div class="devices-grid">
            ${devices_list_html}
        </div>
    </div>
</section>

<!-- Modal pour ajouter un appareil -->
<div id="modal-add-device" class="modal" style="display:none;">
    <div class="modal-content">
        <h3>Ajouter un appareil Modbus</h3>
        <form id="form-add-device">
            <label>Template :</label>
            <select name="template_id" required>
                ${templates_options_html}
            </select>
            
            <label>Nom local :</label>
            <input type="text" name="name" placeholder="Ex: VMC Etage 1" required>
            
            <label>Protocole :</label>
            <select name="protocol" onchange="toggleProtocolFields(this.value)">
                <option value="tcp">Modbus TCP</option>
                <option value="mstp">Modbus RTU/MSTP</option>
            </select>
            
            <div id="fields-tcp">
                <label>Adresse IP :</label>
                <input type="text" name="address_ip" placeholder="192.168.1.50">
                <label>Port :</label>
                <input type="number" name="port" value="502">
            </div>
            
            <div id="fields-mstp" style="display:none;">
                <label>Slave ID :</label>
                <input type="number" name="slave_id" placeholder="1">
            </div>
            
            <div class="modal-buttons">
                <button type="button" onclick="hideModal('modal-add-device')">Annuler</button>
                <button type="submit" class="btn-primary">Ajouter</button>
            </div>
        </form>
    </div>
</div>

<style>
.modal {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
}
.modal-content {
    background: white; padding: 20px; border-radius: 8px; width: 400px;
}
.modal-content form label { display: block; margin-top: 10px; }
.modal-content form input, .modal-content form select { width: 100%; padding: 8px; margin-top: 5px; }
.modal-buttons { margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px; }
</style>

<script>
function showAddDeviceModal() { document.getElementById('modal-add-device').style.display = 'flex'; }
function hideModal(id) { document.getElementById(id).style.display = 'none'; }
function toggleProtocolFields(val) {
    document.getElementById('fields-tcp').style.display = val === 'tcp' ? 'block' : 'none';
    document.getElementById('fields-mstp').style.display = val === 'mstp' ? 'block' : 'none';
}
</script>
