<section class="bacnet-mgr">
    <h2>Gestion BACnet - Chantier: ${site_name}</h2>

    <div class="site-devices">
        <h3>Appareils sur ce site</h3>
        <div class="devices-grid">
            ${devices_list_html}
        </div>
        <button class="btn-primary" onclick="showAddDeviceModal()">➕ Ajouter un appareil</button>
    </div>

    <div class="templates-lib">
        <h3>Bibliothèque de Templates</h3>
        <table class="data-table">
            <thead>
                <tr>
                    <th>Nom</th>
                    <th>Fabricant</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                ${templates_list_html}
            </tbody>
        </table>
        <button class="btn-secondary" onclick="showEditTemplateModal()">📄 Nouveau Template</button>
    </div>
</section>

<!-- Modal pour ajouter un appareil -->
<div id="modal-add-device" class="modal" style="display:none;">
    <div class="modal-content">
        <h3>Ajouter un appareil BACnet</h3>
        <form id="form-add-device">
            <label>Template :</label>
            <select name="template_id" required>
                ${templates_options_html}
            </select>
            
            <label>Nom local :</label>
            <input type="text" name="name" placeholder="Ex: Contrôleur VMC" required>
            
            <label>Instance de l'appareil :</label>
            <input type="number" name="device_instance" placeholder="1234" required>
            
            <label>Adresse Réseau (IP) :</label>
            <input type="text" name="network_address" placeholder="192.168.1.100" required>
            
            <div class="modal-buttons">
                <button type="button" onclick="hideModal('modal-add-device')">Annuler</button>
                <button type="submit" class="btn-primary">Ajouter</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal pour créer/éditer un template -->
<div id="modal-edit-template" class="modal" style="display:none;">
    <div class="modal-content" style="width: 600px; max-height: 90vh; overflow-y: auto;">
        <h3 id="template-modal-title">Nouveau Template BACnet</h3>
        <form id="form-edit-template">
            <input type="hidden" name="template_id" id="field-t-id">
            
            <div style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label>Nom du modèle :</label>
                    <input type="text" name="name" id="field-t-name" placeholder="Ex: IQ4 Controller" required>
                </div>
                <div style="flex: 1;">
                    <label>Fabricant :</label>
                    <input type="text" name="manufacturer" id="field-t-mfr" placeholder="Ex: Trend">
                </div>
            </div>

            <h4 style="margin-top: 20px;">Objets</h4>
            <div id="registers-container">
                <!-- Les lignes d'objets seront ajoutées ici en JS -->
            </div>
            <button type="button" class="btn-secondary" style="margin-top: 10px;" onclick="addObjectRow()">+ Ajouter un objet</button>

            <div class="modal-buttons">
                <button type="button" onclick="hideModal('modal-edit-template')">Annuler</button>
                <button type="submit" class="btn-primary">Enregistrer le Template</button>
            </div>
        </form>
    </div>
</div>

<style>
.data-table {
    width: 100%;
    border-collapse: collapse;
    margin: 15px 0;
}
.data-table th, .data-table td {
    padding: 10px;
    border-bottom: 1px solid #eee;
    text-align: left;
}
.modal {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
}
.modal-content {
    background: white; padding: 20px; border-radius: 8px; width: 400px;
}
.modal-content form label { display: block; margin-top: 10px; }
.modal-content form input, .modal-content form select { width: 100%; padding: 8px; margin-top: 5px; }
.modal-buttons { margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px; }
.btn-primary { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
.btn-secondary { background: var(--secondary); color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
.btn-red { background: #c0392b; color: white; border: none; cursor: pointer; border-radius: 4px; }
.btn-blue { background: #3498db; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
</style>

<script>
function showAddDeviceModal() { document.getElementById('modal-add-device').style.display = 'flex'; }
function hideModal(id) { document.getElementById(id).style.display = 'none'; }

function addObjectRow(data = {}) {
    const container = document.getElementById('registers-container');
    const div = document.createElement('div');
    div.className = 'register-row';
    div.style = "display: flex; gap: 5px; margin-top: 5px; align-items: center;";
    div.innerHTML = `
        <input type="text" name="obj_id[]" placeholder="ID (ex: AI:1)" value="${data.obj || ''}" style="flex: 1;" required>
        <input type="text" name="obj_name[]" placeholder="Libellé" value="${data.name || ''}" style="flex: 3;" required>
        <button type="button" class="btn-red" style="padding: 5px 10px;" onclick="this.parentElement.remove()">×</button>
    `;
    container.appendChild(div);
}

function showEditTemplateModal(templateData = null) {
    const modal = document.getElementById('modal-edit-template');
    const title = document.getElementById('template-modal-title');
    const container = document.getElementById('registers-container');
    
    container.innerHTML = '';
    
    if (templateData) {
        title.textContent = "Modifier le Template";
        document.getElementById('field-t-id').value = templateData.id;
        document.getElementById('field-t-name').value = templateData.name;
        document.getElementById('field-t-mfr').value = templateData.manufacturer;
        
        const objects = JSON.parse(templateData.objects_json || '[]');
        objects.forEach(o => addObjectRow({obj: o.obj, name: o.name}));
    } else {
        title.textContent = "Nouveau Template BACnet";
        document.getElementById('form-edit-template').reset();
        document.getElementById('field-t-id').value = '';
        addObjectRow();
    }
    
    modal.style.display = 'flex';
}
</script>
