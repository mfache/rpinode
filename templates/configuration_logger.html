<section class="configuration-logger">
    <div class="header-with-actions" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <div>
            <h2>⚙️ Configuration des enregistreurs</h2>
            <p class="hint">Ajustez les paramètres de tolérance et de timeout pour les services d'enregistrement.</p>
        </div>
    </div>
    
    <div class="config-card">
        <form id="logger-config-form" onsubmit="saveLoggerConfig(event)">
            <div class="form-group">
                <label for="logger_retries">Nombre de tentatives (Modbus)</label>
                <input type="number" id="logger_retries" name="logger_retries" value="${logger_retries}" min="1" max="10" required>
                <small class="form-hint">Nombre d'échecs consécutifs avant de considérer le point en erreur.</small>
            </div>
            
            <div class="form-group" style="margin-top: 20px;">
                <label for="modbus_timeout">Timeout Modbus (secondes)</label>
                <input type="number" id="modbus_timeout" name="modbus_timeout" value="${modbus_timeout}" step="0.1" min="0.1" max="10" required>
                <small class="form-hint">Délai maximal d'attente pour une lecture Modbus.</small>
            </div>
            
            <div class="form-group" style="margin-top: 20px;">
                <label for="bacnet_timeout">Timeout BACnet (secondes)</label>
                <input type="number" id="bacnet_timeout" name="bacnet_timeout" value="${bacnet_timeout}" min="1" max="120" required>
                <small class="form-hint">Délai maximal d'attente pour le cycle de lecture BACnet.</small>
            </div>
            
            <div style="margin-top: 30px; display: flex; justify-content: flex-end;">
                <button type="submit" class="btn-primary">Enregistrer la configuration</button>
            </div>
        </form>
    </div>
</section>

<style>
.configuration-logger {
    --legacy-panel: rgba(44, 62, 80, 0.88);
    --legacy-panel-soft: rgba(52, 73, 94, 0.78);
    --legacy-border: rgba(148, 163, 184, 0.32);
    --legacy-text: #ecf3f9;
    --legacy-muted: #c7d3df;
    --legacy-primary: #3498db;
    --legacy-primary-hover: #2980b9;
}

.configuration-logger .header-with-actions {
    border-bottom-color: var(--legacy-border);
}

.configuration-logger .config-card {
    background: linear-gradient(180deg, rgba(52, 73, 94, 0.92), rgba(44, 62, 80, 0.96));
    border: 1px solid var(--legacy-border);
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.22);
    max-width: 600px;
}

.form-group label { display: block; font-size: 0.9rem; font-weight: 600; color: var(--legacy-muted); margin-bottom: 8px; }
.form-group input {
    width: 100%;
    padding: 10px 12px;
    font-size: 1rem;
    box-sizing: border-box;
}
.form-hint { font-size: 0.8rem; color: var(--legacy-muted); margin-top: 4px; display: block; }
.configuration-logger .btn-primary {
    background: var(--legacy-primary);
    color: white;
    border-color: transparent;
    padding: 10px 20px;
    border-radius: 6px;
    font-weight: bold;
}
.configuration-logger .btn-primary:hover {
    background: var(--legacy-primary-hover);
}
.hint { color: var(--legacy-muted); font-size: 0.9rem; margin: 0; }
</style>

<script>
function saveLoggerConfig(event) {
    event.preventDefault();
    const formData = new FormData(event.target);
    const data = Object.fromEntries(formData.entries());
    
    // Conversion des types
    data.logger_retries = parseInt(data.logger_retries);
    data.modbus_timeout = parseFloat(data.modbus_timeout);
    data.bacnet_timeout = parseInt(data.bacnet_timeout);
    
    fetch(window.CONFIG.baseUrl + '/api/configuration/logger/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    })
    .then(response => response.json())
    .then(result => {
        if (result.status === 'ok') {
            alert('Configuration enregistrée avec succès.');
        } else {
            alert('Erreur : ' + result.message);
        }
    })
    .catch(err => {
        console.error(err);
        alert('Erreur lors de l\'enregistrement.');
    });
}
</script>
