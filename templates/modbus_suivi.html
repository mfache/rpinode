<section class="modbus-suivi-view">
    <div class="header-with-actions" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
        <div>
            <h2>Points Modbus Suivis (Live)</h2>
            <p class="hint">Chantier : <strong>${site_name}</strong></p>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <button class="btn-primary" onclick="refreshLiveValues(true)" id="btn-refresh-manual">
                <span>🔄</span> Rafraîchir
            </button>
            <a href="${base_url}/modbus/devices" class="btn-secondary">Gérer les appareils</a>
        </div>
    </div>

    <div class="card">
        <div class="suivi-toolbar">
            <div class="suivi-help">
                Cochez <strong>Enregistrer</strong> pour historiser les données dans les tendances (Trends).
            </div>
            <div class="suivi-bulk-actions">
                <button type="button" class="btn-secondary btn-sm" onclick="toggleAllRecords(true)">Tout cocher</button>
                <button type="button" class="btn-secondary btn-sm" onclick="toggleAllRecords(false)">Tout décocher</button>
            </div>
        </div>
        <table class="data-table">
            <thead>
                <tr>
                    <th>Appareil</th>
                    <th>Point</th>
                    <th>Nom du registre</th>
                    <th>Valeur Live</th>
                    <th>Enregistrement</th>
                    <th>Cadence</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="suivi-tbody">
                ${suivi_rows_html}
            </tbody>
        </table>
    </div>
</section>

<style>
.modbus-suivi-view {
    --legacy-panel: rgba(44, 62, 80, 0.88);
    --legacy-panel-soft: rgba(52, 73, 94, 0.78);
    --legacy-panel-deep: rgba(28, 41, 56, 0.92);
    --legacy-border: rgba(148, 163, 184, 0.32);
    --legacy-border-strong: rgba(191, 219, 254, 0.26);
    --legacy-text: #ecf3f9;
    --legacy-muted: #c7d3df;
    --legacy-primary: #3498db;
    --legacy-primary-hover: #2980b9;
}

.modbus-suivi-view .header-with-actions {
    border-bottom-color: var(--legacy-border);
}

.modbus-suivi-view .card {
    background: linear-gradient(180deg, rgba(52, 73, 94, 0.88), rgba(44, 62, 80, 0.92));
    border: 1px solid var(--legacy-border);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
}

.modbus-suivi-view .data-table th,
.modbus-suivi-view .data-table td {
    border-bottom-color: var(--legacy-border);
}

.modbus-suivi-view .data-table th {
    background: var(--legacy-panel-deep);
    color: var(--legacy-muted);
}

.modbus-suivi-view .data-table tbody tr:hover {
    background: rgba(255, 255, 255, 0.04);
}

.modbus-suivi-view .btn-primary {
    background: var(--legacy-primary);
    color: #f7fbff;
    box-shadow: 0 0 12px rgba(52, 152, 219, 0.22);
}

.modbus-suivi-view .btn-primary:hover {
    background: var(--legacy-primary-hover);
}

.modbus-suivi-view .btn-secondary {
    background: var(--legacy-panel-soft);
    color: var(--legacy-text);
    border-color: var(--legacy-border);
}

.modbus-suivi-view .btn-secondary:hover {
    background: rgba(67, 89, 110, 0.92);
    color: #ffffff;
    border-color: var(--legacy-border-strong);
}

.suivi-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 10px;
}

.suivi-help {
    font-size: 0.9em;
    color: var(--legacy-muted);
}

.suivi-bulk-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.badge-gray {
    background: var(--legacy-panel-deep);
    color: var(--legacy-muted);
    border: 1px solid var(--legacy-border);
    padding: 4px 8px;
    border-radius: var(--radius);
    font-family: var(--font-mono);
    font-size: 0.95em;
}

.badge-success {
    background: rgba(39, 174, 96, 0.2);
    color: #d7f8e6;
    border: 1px solid rgba(125, 206, 160, 0.34);
    padding: 4px 8px;
    border-radius: var(--radius);
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 0.95em;
}

.badge-error {
    background: rgba(192, 57, 43, 0.22);
    color: #ffd4cf;
    border: 1px solid rgba(255, 180, 171, 0.28);
    padding: 4px 8px;
    border-radius: var(--radius);
    font-family: var(--font-mono);
    font-size: 0.9em;
}

.suivi-flash {
    animation: flashHighlight 1s ease-out;
}

@keyframes flashHighlight {
    0% { background-color: rgba(52, 152, 219, 0.24); }
    100% { background-color: transparent; }
}

.btn-icon-del {
    background: none;
    border: none;
    color: #ffb4ab;
    font-size: 1.1em;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: var(--radius);
}

.btn-icon-del:hover {
    background: rgba(192, 57, 43, 0.22);
}

.cadence-select {
    width: auto;
    min-width: 78px;
    padding: 3px 6px;
    border: 1px solid var(--legacy-border);
    border-radius: var(--radius);
    font-size: 0.85em;
    background: var(--legacy-panel-deep);
    color: var(--legacy-text);
    font-family: var(--font-mono);
}
</style>

<script>
const baseUrl = window.CONFIG?.baseUrl || '';
let lastValues = {};

function seedInitialValues() {
    document.querySelectorAll("[data-suivi-key]").forEach(el => {
        const key = el.getAttribute("data-suivi-key");
        lastValues[key] = el.textContent.trim();
    });
}

async function refreshLiveValues(isManual = false) {
    const btn = document.getElementById('btn-refresh-manual');
    if (isManual && btn) btn.disabled = true;

    try {
        const url = (baseUrl + '/api/modbus/suivi/values').replace(/\/+/g, '/');
        const res = await fetch(url);
        const data = await res.json();

        if (data && data.values) {
            Object.keys(data.values).forEach(pointId => {
                const item = data.values[pointId];
                const el = document.getElementById(`val-${pointId}`);
                if (!el) return;

                const newDisplay = item.display || "—";
                if (item.error) {
                    el.className = "live-val badge-error";
                    el.textContent = "Err";
                    el.title = item.error;
                } else {
                    el.className = "live-val badge-success";
                    el.textContent = newDisplay;
                    el.title = `Mis à jour à ${new Date(item.ts * 1000).toLocaleTimeString()}`;

                    if (lastValues[pointId] !== newDisplay) {
                        el.classList.remove("suivi-flash");
                        void el.offsetWidth;
                        el.classList.add("suivi-flash");
                        lastValues[pointId] = newDisplay;
                    }
                }
            });
        }
    } catch (err) {
        console.error("Erreur refresh modbus suivi:", err);
    } finally {
        if (isManual && btn) btn.disabled = false;
    }
}

async function toggleAllRecords(checked) {
    const checkboxes = document.querySelectorAll('.cb-record');
    const promises = [];
    checkboxes.forEach(cb => {
        if (cb.checked !== checked) {
            cb.checked = checked;
            const pid = cb.getAttribute('data-point-id');
            const cadenceEl = document.getElementById(`cadence-${pid}`);
            if (cadenceEl) cadenceEl.disabled = !checked;
            const cadence = cadenceEl ? cadenceEl.value : '1m';
            promises.push(
                fetch((baseUrl + '/api/modbus/point/update').replace(/\/+/g, '/'), {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        point_id: pid,
                        is_recorded: checked ? 1 : 0,
                        cadence: cadence
                    })
                })
            );
        }
    });
    if (promises.length > 0) {
        try {
            await Promise.all(promises);
        } catch (e) {
            console.error("Erreur mise à jour globale:", e);
        }
    }
}

async function toggleRecord(pointId, isRecorded) {
    const cadenceEl = document.getElementById(`cadence-${pointId}`);
    const cadence = cadenceEl ? cadenceEl.value : '1m';
    if (cadenceEl) cadenceEl.disabled = !isRecorded;

    try {
        const url = (baseUrl + '/api/modbus/point/update').replace(/\/+/g, '/');
        const res = await fetch(url, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                point_id: pointId,
                is_recorded: isRecorded ? 1 : 0,
                cadence: cadence
            })
        });
        const data = await res.json();
        if (data.status !== 'ok') {
            alert("Erreur lors de la mise à jour: " + (data.message || "Erreur inconnue"));
        }
    } catch (e) {
        alert("Erreur réseau");
    }
}

async function changeCadence(pointId, cadence) {
    try {
        const url = (baseUrl + '/api/modbus/point/update').replace(/\/+/g, '/');
        await fetch(url, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                point_id: pointId,
                cadence: cadence
            })
        });
    } catch (e) {
        console.error("Erreur changement cadence:", e);
    }
}

async function removePoint(pointId) {
    if (!confirm("Retirer ce point du suivi ?")) return;

    try {
        const url = (baseUrl + '/api/modbus/point/delete').replace(/\/+/g, '/');
        const res = await fetch(url, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ point_id: pointId })
        });
        const data = await res.json();
        if (data.status === 'ok') {
            const row = document.getElementById(`suivi-row-${pointId}`);
            if (row) row.remove();
        } else {
            alert("Erreur: " + data.message);
        }
    } catch (e) {
        alert("Erreur réseau");
    }
}

document.addEventListener("DOMContentLoaded", () => {
    seedInitialValues();
});
</script>
