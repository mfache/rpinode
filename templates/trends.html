<section class="monitor-suivi-view">
    <div class="header-with-actions" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
        <div>
            <h2>Suivi Global des Points (Live)</h2>
            <p class="hint">Chantier : <strong>${site_name}</strong> | Vue unifiée de l'ensemble des points supervisés (Modbus, BACnet, MBus...)</p>
        </div>
        <div class="monitor-actions">
            <label class="auto-refresh-toggle">
                <input type="checkbox" id="auto-refresh-toggle" checked onchange="toggleAutoRefresh(this.checked)">
                <span>Auto-refresh (5s)</span>
            </label>
            <button class="btn-primary" onclick="refreshLiveValues(true)" id="btn-refresh-manual">
                <span>🔄</span> Rafraîchir
            </button>
            <a href="${base_url}/modbus/devices" class="btn-secondary">Appareils Modbus</a>
            <a href="${base_url}/bacnet/devices" class="btn-secondary">Appareils BACnet</a>
        </div>
    </div>

    <!-- Filtres rapides -->
    <div class="monitor-toolbar">
        <div class="protocol-filters">
            <button class="filter-btn active" onclick="filterProtocol('all', this)">Tous</button>
            <button class="filter-btn" onclick="filterProtocol('modbus-tcp', this)">Modbus TCP</button>
            <button class="filter-btn" onclick="filterProtocol('modbus-mstp', this)">Modbus RTU / MSTP</button>
            <button class="filter-btn" onclick="filterProtocol('bacnet', this)">BACnet</button>
        </div>
        <div class="text-filter-box">
            <input type="text" id="suivi-text-filter" class="text-filter-input" placeholder="Filtrer... (ex: TGBT*, *temp*)" oninput="applyFilters()">
        </div>
        <div class="points-count-display" id="points-count-display">
            <!-- Rempli en JS -->
        </div>
    </div>

    <div class="monitor-toolbar monitor-toolbar-bulk">
        <div class="bulk-actions">
            <span class="bulk-actions-label">Enregistrement :</span>
            <button class="btn-secondary btn-sm" onclick="recordAll()">☑️ Tout enregistrer</button>
            <button class="btn-secondary btn-sm" onclick="recordNone()">☐ Rien enregistrer</button>
            <button class="btn-secondary btn-sm" onclick="recordVisible()">💾 Enregistrer la liste affichée</button>
        </div>
    </div>

    <div class="card">
        <table class="data-table">
            <thead>
                <tr>
                    <th class="sortable-th" onclick="sortTable(0)">Protocole<span class="sort-arrow" id="sort-arrow-0"></span></th>
                    <th class="sortable-th" onclick="sortTable(1)">Appareil<span class="sort-arrow" id="sort-arrow-1"></span></th>
                    <th class="sortable-th" onclick="sortTable(2)">Point<span class="sort-arrow" id="sort-arrow-2"></span></th>
                    <th class="sortable-th" onclick="sortTable(3)">Nom du point<span class="sort-arrow" id="sort-arrow-3"></span></th>
                    <th class="sortable-th" onclick="sortTable(4)">Valeur Live<span class="sort-arrow" id="sort-arrow-4"></span></th>
                    <th class="sortable-th" onclick="sortTable(5)">Enregistrement<span class="sort-arrow" id="sort-arrow-5"></span></th>
                    <th class="sortable-th" onclick="sortTable(6)">Cadence<span class="sort-arrow" id="sort-arrow-6"></span></th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="suivi-tbody">
                ${trends_rows_html}
            </tbody>
        </table>
    </div>
</section>

}

.cadence-select {
    width: auto;
    min-width: 78px;
    padding: 3px 6px;
    border: 1px solid var(--legacy-border);
    border-radius: var(--radius);

    background: var(--legacy-panel-deep);
    color: var(--legacy-text);

}

.filter-btn {
    padding: 5px 12px;
    background: var(--legacy-panel-soft);
    border: 1px solid var(--legacy-border);

<script>
const baseUrl = window.CONFIG ? window.CONFIG.baseUrl : '/rpinode';
let autoRefreshTimer = null;
let lastValues = {};
let currentProtoFilter = 'all';
const LIVE_VALUE_COL = 4;
const RECORD_COL = 5;
const CADENCE_COL = 6;
let currentSort = { col: null, dir: 1 };

function updatePointsCount() {
    const rows = document.querySelectorAll('#suivi-tbody tr[data-proto]');
    const visibleRows = Array.from(rows).filter(r => r.style.display !== 'none');
    const display = document.getElementById('points-count-display');
    if (display) {
        display.textContent = `${visibleRows.length} point(s) affiché(s)`;
    }
}

// Convertit un motif texte+joker (* = n'importe quels caractères, ? = un caractère)
// en expression régulière insensible à la casse (recherche non ancrée = "contient").
function wildcardToRegex(pattern) {
    const escaped = pattern.replace(/[.+^${}()|[\]\\]/g, '\\$&');
    const withWildcards = escaped.replace(/\*/g, '.*').replace(/\?/g, '.');
    return new RegExp(withWildcards, 'i');
}

function filterProtocol(proto, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    currentProtoFilter = proto;
    applyFilters();
}

function applyFilters() {
    const rows = document.querySelectorAll('#suivi-tbody tr[data-proto]');
    const textQuery = (document.getElementById('suivi-text-filter')?.value || '').trim();
    const textRegex = textQuery ? wildcardToRegex(textQuery) : null;

    rows.forEach(r => {
        const rowProto = r.getAttribute('data-proto') || '';
        const protoOk = currentProtoFilter === 'all' || rowProto === currentProtoFilter || rowProto.startsWith(currentProtoFilter);
        const searchText = r.getAttribute('data-search') || '';
        const textOk = !textRegex || textRegex.test(searchText);
        r.style.display = (protoOk && textOk) ? '' : 'none';
    });
    updatePointsCount();
}

// --- Tri par colonnes ---

function getSortValue(row, colIndex) {
    const cell = row.children[colIndex];
    if (!cell) return '';

    if (colIndex === LIVE_VALUE_COL) {
        const valEl = cell.querySelector('.live-val');
        const text = (valEl ? valEl.textContent : cell.textContent).trim();
        const num = parseFloat(text.replace(',', '.'));
        return { num: isNaN(num) ? null : num, text: text.toLowerCase() };
    }
    if (colIndex === RECORD_COL) {
        const cb = cell.querySelector('input[type="checkbox"]');
        return cb && cb.checked ? 1 : 0;
    }
    if (colIndex === CADENCE_COL) {
        const sel = cell.querySelector('select');
        return sel ? sel.value : '';
    }
    return cell.textContent.trim().toLowerCase();
}

function compareSortValues(a, b) {
    if (typeof a === 'number' && typeof b === 'number') return a - b;
    if (a && typeof a === 'object' && 'num' in a) {
        if (a.num !== null && b.num !== null) return a.num - b.num;
        if (a.num !== null) return -1;
        if (b.num !== null) return 1;
        return a.text.localeCompare(b.text);
    }
    return String(a).localeCompare(String(b));
}

function applySort() {
    if (currentSort.col === null) return;
    const tbody = document.getElementById('suivi-tbody');
    const rows = Array.from(tbody.querySelectorAll('tr[data-proto]'));
    rows.sort((r1, r2) => {
        return compareSortValues(getSortValue(r1, currentSort.col), getSortValue(r2, currentSort.col)) * currentSort.dir;
    });
    rows.forEach(r => tbody.appendChild(r));
}

function updateSortIndicators() {
    document.querySelectorAll('.sort-arrow').forEach(el => el.textContent = '');
    if (currentSort.col === null) return;
    const arrow = document.getElementById('sort-arrow-' + currentSort.col);
    if (arrow) arrow.textContent = currentSort.dir === 1 ? ' ▲' : ' ▼';
}

function sortTable(colIndex) {
    if (currentSort.col === colIndex) {
        currentSort.dir *= -1;
    } else {
        currentSort.col = colIndex;
        currentSort.dir = 1;
    }
    applySort();
    updateSortIndicators();
}

function seedInitialValues() {
    document.querySelectorAll("[data-suivi-key]").forEach(el => {
        const key = el.getAttribute("data-suivi-key");
        lastValues[key] = el.textContent.trim();
    });
}

async function refreshLiveValues(isManual = false) {
    const btn = document.getElementById('btn-refresh-manual');
    if (isManual && btn) btn.disabled = true;

    try {
        const url = (baseUrl + '/api/monitor/suivi/values').replace(/\/+/g, '/');
        const res = await fetch(url);
        const data = await res.json();

        if (data && data.values) {
            Object.keys(data.values).forEach(pointId => {
                const item = data.values[pointId];
                const el = document.getElementById(`val-${pointId}`);
                if (!el) return;

                const newDisplay = item.display || "—";
                if (item.error) {
                    el.className = "live-val badge-error";
                    el.textContent = "Err";
                    el.title = item.error;
                } else {
                    el.className = "live-val badge-success";
                    el.textContent = newDisplay;
                    el.title = `Mis à jour à ${new Date(item.ts * 1000).toLocaleTimeString()}`;

                    if (lastValues[pointId] !== newDisplay) {
                        el.classList.remove("suivi-flash");
                        void el.offsetWidth;
                        el.classList.add("suivi-flash");
                        lastValues[pointId] = newDisplay;
                    }
                }
            });

            if (currentSort.col === LIVE_VALUE_COL) {
                applySort();
            }
        }
    } catch (err) {
        console.error("Erreur refresh suivi:", err);
    } finally {
        if (isManual && btn) btn.disabled = false;
    }
}

function startAutoRefreshLoop() {
    stopAutoRefreshLoop();
    const toggle = document.getElementById('auto-refresh-toggle');
    if (!toggle || !toggle.checked) return;

    autoRefreshTimer = setInterval(() => {
        refreshLiveValues(false);
    }, 5000);
}

function stopAutoRefreshLoop() {
    if (autoRefreshTimer) {
        clearInterval(autoRefreshTimer);
        autoRefreshTimer = null;
    }
}

function toggleAutoRefresh(enabled) {
    if (enabled) {
        startAutoRefreshLoop();
        refreshLiveValues(false);
    } else {
        stopAutoRefreshLoop();
    }
}

async function toggleRecord(pointId, isRecorded, proto = 'modbus', silent = false) {
    const cadenceId = proto === 'bacnet' ? `cadence-bac-${pointId}` : `cadence-${pointId}`;
    const cadenceEl = document.getElementById(cadenceId);
    const cadence = cadenceEl ? cadenceEl.value : '1m';
    if (cadenceEl) cadenceEl.disabled = !isRecorded;

    const endpoint = proto === 'bacnet' ? '/api/bacnet/point/update' : '/api/modbus/point/update';
    try {
        const url = (baseUrl + endpoint).replace(/\/+/g, '/');
        const res = await fetch(url, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                point_id: pointId,
                is_recorded: isRecorded ? 1 : 0,
                cadence: cadence
            })
        });
        const data = await res.json();
        if (data.status !== 'ok') {
            if (!silent) alert("Erreur lors de la mise à jour: " + (data.message || "Erreur inconnue"));
            return false;
        }
        return true;
    } catch (e) {
        if (!silent) alert("Erreur réseau");
        return false;
    }
}

// --- Enregistrement en masse ---

async function setRowsRecording(rows, recorded) {
    const tasks = rows.map(row => {
        const cb = row.querySelector('.cb-record');
        if (!cb) return Promise.resolve(true);
        const pointId = cb.getAttribute('data-point-id');
        const proto = row.id.indexOf('suivi-row-bac-') === 0 ? 'bacnet' : 'modbus';
        cb.checked = recorded;
        return toggleRecord(pointId, recorded, proto, true);
    });
    const results = await Promise.all(tasks);
    const failures = results.filter(ok => ok === false).length;
    if (failures > 0) {
        alert(`${failures} point(s) n'ont pas pu être mis à jour.`);
    }
    if (currentSort.col === RECORD_COL) {
        applySort();
    }
}

async function recordAll() {
    const rows = Array.from(document.querySelectorAll('#suivi-tbody tr[data-proto]'));
    if (rows.length === 0) return;
    if (!confirm(`Activer l'enregistrement pour les ${rows.length} point(s) (tous, filtres ignorés) ?`)) return;
    await setRowsRecording(rows, true);
}

async function recordNone() {
    const rows = Array.from(document.querySelectorAll('#suivi-tbody tr[data-proto]'));
    if (rows.length === 0) return;
    if (!confirm(`Désactiver l'enregistrement pour les ${rows.length} point(s) (tous, filtres ignorés) ?`)) return;
    await setRowsRecording(rows, false);
}

async function recordVisible() {
    const rows = Array.from(document.querySelectorAll('#suivi-tbody tr[data-proto]')).filter(r => r.style.display !== 'none');
    if (rows.length === 0) {
        alert("Aucun point affiché avec les filtres actuels.");
        return;
    }
    if (!confirm(`Activer l'enregistrement pour les ${rows.length} point(s) actuellement affiché(s) ?`)) return;
    await setRowsRecording(rows, true);
}

async function changeCadence(pointId, cadence, proto = 'modbus') {
    const endpoint = proto === 'bacnet' ? '/api/bacnet/point/update' : '/api/modbus/point/update';
    try {
        const url = (baseUrl + endpoint).replace(/\/+/g, '/');
        await fetch(url, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                point_id: pointId,
                cadence: cadence
            })
        });
    } catch (e) {
        console.error("Erreur changement cadence:", e);
    }
}

async function removePoint(pointId, proto = 'modbus') {
    if (!confirm("Retirer ce point du suivi ?")) return;

    const endpoint = proto === 'bacnet' ? '/api/bacnet/point/delete' : '/api/modbus/point/delete';
    const rowId = proto === 'bacnet' ? `suivi-row-bac-${pointId}` : `suivi-row-${pointId}`;
    try {
        const url = (baseUrl + endpoint).replace(/\/+/g, '/');
        const res = await fetch(url, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ point_id: pointId })
        });
        const data = await res.json();
        if (data.status === 'ok') {
            const row = document.getElementById(rowId);
            if (row) row.remove();
            updatePointsCount();
        } else {
            alert("Erreur: " + data.message);
        }
    } catch (e) {
        alert("Erreur réseau");
    }
}

document.addEventListener("DOMContentLoaded", () => {
    seedInitialValues();
    updatePointsCount();
    startAutoRefreshLoop();
    setTimeout(() => refreshLiveValues(false), 500);
});
</script>
