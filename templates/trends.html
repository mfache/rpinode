<section class="monitor-suivi-view">
    <div class="header-with-actions" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
        <div>
            <h2>Suivi Global des Points (Live)</h2>
            <p class="hint">Chantier : <strong>${site_name}</strong> | Vue unifiée de l'ensemble des points supervisés (Modbus, BACnet, MBus...)</p>
        </div>
        <div class="monitor-actions">
            <label class="auto-refresh-toggle">
                <input type="checkbox" id="auto-refresh-toggle" checked onchange="toggleAutoRefresh(this.checked)">
                <span>Auto-refresh (5s)</span>
            </label>
            <button class="btn-primary" onclick="refreshLiveValues(true)" id="btn-refresh-manual">
                <span>🔄</span> Rafraîchir
            </button>
            <a href="${base_url}/modbus/devices" class="btn-secondary">Appareils Modbus</a>
            <a href="${base_url}/bacnet/devices" class="btn-secondary">Appareils BACnet</a>
        </div>
    </div>

    <!-- Filtres rapides -->
    <div class="monitor-toolbar">
        <div class="protocol-filters">
            <button class="filter-btn active" onclick="filterProtocol('all', this)">Tous</button>
            <button class="filter-btn" onclick="filterProtocol('modbus-tcp', this)">Modbus TCP</button>
            <button class="filter-btn" onclick="filterProtocol('modbus-mstp', this)">Modbus RTU / MSTP</button>
            <button class="filter-btn" onclick="filterProtocol('bacnet', this)">BACnet</button>
        </div>
        <div class="points-count-display" id="points-count-display">
            <!-- Rempli en JS -->
        </div>
    </div>

    <div class="card">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Protocole</th>
                    <th>Appareil</th>
                    <th>Point</th>
                    <th>Nom du point</th>
                    <th>Valeur Live</th>
                    <th>Enregistrement</th>
                    <th>Cadence</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="suivi-tbody">
                ${trends_rows_html}
            </tbody>
        </table>
    </div>
</section>

<style>

    --legacy-border-strong: rgba(191, 219, 254, 0.26);
    --legacy-text: #ecf3f9;
    --legacy-muted: #c7d3df;
    --legacy-primary: #3498db;
    --legacy-primary-hover: #2980b9;
}

.monitor-suivi-view .header-with-actions {
    border-bottom-color: var(--legacy-border);
}

.monitor-suivi-view .card {
    background: linear-gradient(180deg, rgba(52, 73, 94, 0.88), rgba(44, 62, 80, 0.92));

}

.monitor-suivi-view .data-table th,
.monitor-suivi-view .data-table td {
    border-bottom-color: var(--legacy-border);
}

    background: var(--legacy-panel-deep);
    color: var(--legacy-muted);
}

.monitor-suivi-view .data-table tbody tr:hover {
    background: rgba(255, 255, 255, 0.04);
}

.monitor-suivi-view .btn-primary {
    background: var(--legacy-primary);
    color: #f7fbff;
    box-shadow: 0 0 12px rgba(52, 152, 219, 0.22);
}

.monitor-suivi-view .btn-primary:hover {
    background: var(--legacy-primary-hover);
}

.monitor-suivi-view .btn-secondary {
    background: var(--legacy-panel-soft);
    color: var(--legacy-text);
    border-color: var(--legacy-border);
}

.monitor-suivi-view .btn-secondary:hover {
    background: rgba(67, 89, 110, 0.92);
    color: #ffffff;
    border-color: var(--legacy-border-strong);

.monitor-actions {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;

.cadence-select {

    min-width: 78px;
    padding: 3px 6px;
    border: 1px solid var(--legacy-border);
    border-radius: var(--radius);
    font-size: 0.85em;
    background: var(--legacy-panel-deep);
    color: var(--legacy-text);
    font-family: var(--font-mono);
}

.filter-btn {
    padding: 5px 12px;
    background: var(--legacy-panel-soft);
    border: 1px solid var(--legacy-border);
    border-radius: var(--radius-md);
    font-size: 0.85em;
    cursor: pointer;
    color: var(--legacy-muted);
    transition: all 0.2s ease;
}

.filter-btn:hover {
    background: rgba(67, 89, 110, 0.92);
    color: #ffffff;
}

.filter-btn.active {

    color: #f7fbff;
    border-color: transparent;
    box-shadow: 0 0 12px rgba(52, 152, 219, 0.22);
}
</style>

<script>
const baseUrl = window.CONFIG ? window.CONFIG.baseUrl : '/rpinode';
let autoRefreshTimer = null;
let lastValues = {};

function updatePointsCount() {
    const rows = document.querySelectorAll('#suivi-tbody tr[data-proto]');
    const visibleRows = Array.from(rows).filter(r => r.style.display !== 'none');
    const display = document.getElementById('points-count-display');
    if (display) {
        display.textContent = `${visibleRows.length} point(s) affiché(s)`;
    }
}

function filterProtocol(proto, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');

    const rows = document.querySelectorAll('#suivi-tbody tr[data-proto]');
    rows.forEach(r => {
        const rowProto = r.getAttribute('data-proto') || '';
        if (proto === 'all' || rowProto === proto || rowProto.startsWith(proto)) {
            r.style.display = '';
        } else {
            r.style.display = 'none';
        }
    });
    updatePointsCount();
}

function seedInitialValues() {
    document.querySelectorAll("[data-suivi-key]").forEach(el => {
        const key = el.getAttribute("data-suivi-key");
        lastValues[key] = el.textContent.trim();
    });
}

async function refreshLiveValues(isManual = false) {
    const btn = document.getElementById('btn-refresh-manual');
    if (isManual && btn) btn.disabled = true;

    try {
        const url = (baseUrl + '/api/monitor/suivi/values').replace(/\/+/g, '/');
        const res = await fetch(url);
        const data = await res.json();

        if (data && data.values) {
            Object.keys(data.values).forEach(pointId => {
                const item = data.values[pointId];
                const el = document.getElementById(`val-${pointId}`);
                if (!el) return;

                const newDisplay = item.display || "—";
                if (item.error) {
                    el.className = "live-val badge-error";
                    el.textContent = "Err";
                    el.title = item.error;
                } else {
                    el.className = "live-val badge-success";
                    el.textContent = newDisplay;
                    el.title = `Mis à jour à ${new Date(item.ts * 1000).toLocaleTimeString()}`;

                    if (lastValues[pointId] !== newDisplay) {
                        el.classList.remove("suivi-flash");
                        void el.offsetWidth;
                        el.classList.add("suivi-flash");
                        lastValues[pointId] = newDisplay;
                    }
                }
            });
        }
    } catch (err) {
        console.error("Erreur refresh suivi:", err);
    } finally {
        if (isManual && btn) btn.disabled = false;
    }
}

function startAutoRefreshLoop() {
    stopAutoRefreshLoop();
    const toggle = document.getElementById('auto-refresh-toggle');
    if (!toggle || !toggle.checked) return;

    autoRefreshTimer = setInterval(() => {
        refreshLiveValues(false);
    }, 5000);
}

function stopAutoRefreshLoop() {
    if (autoRefreshTimer) {
        clearInterval(autoRefreshTimer);
        autoRefreshTimer = null;
    }
}

function toggleAutoRefresh(enabled) {
    if (enabled) {
        startAutoRefreshLoop();
        refreshLiveValues(false);
    } else {
        stopAutoRefreshLoop();
    }
}

async function toggleRecord(pointId, isRecorded, proto = 'modbus') {
    const cadenceId = proto === 'bacnet' ? `cadence-bac-${pointId}` : `cadence-${pointId}`;
    const cadenceEl = document.getElementById(cadenceId);
    const cadence = cadenceEl ? cadenceEl.value : '1m';
    if (cadenceEl) cadenceEl.disabled = !isRecorded;

    const endpoint = proto === 'bacnet' ? '/api/bacnet/point/update' : '/api/modbus/point/update';
    try {
        const url = (baseUrl + endpoint).replace(/\/+/g, '/');
        const res = await fetch(url, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                point_id: pointId,
                is_recorded: isRecorded ? 1 : 0,
                cadence: cadence
            })
        });
        const data = await res.json();
        if (data.status !== 'ok') {
            alert("Erreur lors de la mise à jour: " + (data.message || "Erreur inconnue"));
        }
    } catch (e) {
        alert("Erreur réseau");
    }
}

async function changeCadence(pointId, cadence, proto = 'modbus') {
    const endpoint = proto === 'bacnet' ? '/api/bacnet/point/update' : '/api/modbus/point/update';
    try {
        const url = (baseUrl + endpoint).replace(/\/+/g, '/');
        await fetch(url, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                point_id: pointId,
                cadence: cadence
            })
        });
    } catch (e) {
        console.error("Erreur changement cadence:", e);
    }
}

async function removePoint(pointId, proto = 'modbus') {
    if (!confirm("Retirer ce point du suivi ?")) return;

    const endpoint = proto === 'bacnet' ? '/api/bacnet/point/delete' : '/api/modbus/point/delete';
    const rowId = proto === 'bacnet' ? `suivi-row-bac-${pointId}` : `suivi-row-${pointId}`;
    try {
        const url = (baseUrl + endpoint).replace(/\/+/g, '/');
        const res = await fetch(url, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ point_id: pointId })
        });
        const data = await res.json();
        if (data.status === 'ok') {
            const row = document.getElementById(rowId);
            if (row) row.remove();
            updatePointsCount();
        } else {
            alert("Erreur: " + data.message);
        }
    } catch (e) {
        alert("Erreur réseau");
    }
}

document.addEventListener("DOMContentLoaded", () => {
    seedInitialValues();
    updatePointsCount();
    startAutoRefreshLoop();
    setTimeout(() => refreshLiveValues(false), 500);
});
</script>
