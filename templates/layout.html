<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0e1416">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>${title}</title>
    <link rel="manifest" href="${base_url}/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <link rel="stylesheet" href="${base_url}/static/style.css?v=${version}">
    <script>
        // Configuration globale pour le JS
        window.CONFIG = { baseUrl: "${base_url}", version: "${version}" };

        // Enregistrement du Service Worker pour la PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('${base_url}/sw.js?v=${version}', { scope: '${base_url}/' })
                    .then(reg => {
                        console.log('Service Worker enregistré !', reg);
                        reg.update();
                    })
                    .catch(err => console.log('Échec enregistrement SW', err));
            });
        }
    </script>
    <script src="${base_url}/static/app.js?v=${version}" defer></script>
</head>
<body class="bg-background text-on-background">
    <header class="app-header">
        <div class="header-content">
            <!-- Gauche : Menu Mobile, Logo et Hostname -->
            <div class="header-left">
                <button class="menu-toggle" onclick="toggleSidebar()" title="Menu">
                    <span class="material-symbols-outlined">menu</span>
                </button>
                <a href="${base_url}/" class="brand-link">
                    <img src="${base_url}/static/DELTA-Thermic-v3_reverse.png" alt="Deltathermic" class="brand-logo">
                </a>
                <div class="header-divider"></div>
                <div class="host-info">
                    <div class="host-title-row">
                        <h2 class="host-name">${site_name}</h2>
                        <span id="heartbeat-dot" title="Flux de données actif" class="pulse-dot"></span>
                        <a href="${base_url}/monitor/system" id="subt_sync_ok" title="⚠️ Problème de synchronisation (Cliquez pour voir l'état)" class="sync-warn-dot"></a>
                        <span id="heartbeat-timer" class="heartbeat-timer"></span>
                    </div>
                    <div class="host-telemetry">
                        <span class="telemetry-item"><span id="subt_cpu_temp" class="data-val">--°C</span>
                        <span class="telemetry-sep">•</span>
                        <span class="telemetry-item"><span id="subt_uptime" class="data-val">--</span>
                    </div>
                </div>
            </div>

            <!-- Droite : Actions système -->
            <div class="header-right">
                <div class="user-badge">
                    <span class="material-symbols-outlined icon-sm">account_circle</span>
                    <span class="user-name">unknown</span>
                </div>
                <div class="header-actions">

                </div>
            </div>
        </div>
    </header>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        ${nav}

        <main class="main-content">
            <!-- Bannière de blocage si chantier provisoire -->
            <div id="subt_is_provisional" class="provisional-banner" style="display:none;">
                <div class="provisional-title">
                    <span class="material-symbols-outlined">warning</span>
                    <span>CHANTIER PROVISOIRE : Services d'enregistrement et de synchronisation désactivés.</span>
                </div>

                <div id="site-selector" class="site-selector-box">
                    <div id="fleet-unregistered-warning" style="display:none;" class="fleet-warn">
                        Note : Boîtier non enregistré sur la flotte. Recherche distante désactivée.
                    </div>
                    <label for="site-search">Rechercher un chantier existant ou en créer un :</label>
                    <div class="site-search-row">
                        <input type="text" id="site-search" placeholder="Nom du chantier..." class="input-dark">
                        <button onclick="confirmNewSite()" class="btn-primary-sm">Valider</button>
                    </div>
                    <div id="site-results" class="site-results-dropdown" style="display: none;">
                        <!-- Résultats de recherche ici -->
                    </div>
                </div>
            </div>

            <!-- Injection du contenu de la page -->
            ${content}
        </main>
    </div>
</body>
</html>
