# Drop-in systemd pour activer le mode --compat de bluetoothd.
#
# Nécessaire pour :
# - `sdptool` (enregistrement du profil Serial Port / SPP en SDP)
# - l'ancien socket SDP raw utilisé par `rfcomm`
#
# Installation :
#   sudo install -D -m 644 bluetooth-compat.conf \
#       /etc/systemd/system/bluetooth.service.d/bluetooth-compat.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart bluetooth
[Service]
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd --compat
